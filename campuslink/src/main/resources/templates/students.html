<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>CampusLink - Students</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Student Management</h1>
            <p class="text-muted">Manage CampusLink student profiles</p>
        </div>

        <a href="/students/new" class="btn btn-primary">
            + Add Student
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Skills</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="student : ${students}">

                    <td th:text="${student.id}"></td>

                    <td th:text="${student.fullName}"></td>

                    <td th:text="${student.email}"></td>

                    <td th:text="${student.course}"></td>

                    <td th:text="${student.skills}"></td>

                    <td>
                        <a
                                th:href="@{/students/edit/{id}(id=${student.id})}"
                                class="btn btn-sm btn-warning">
                            Edit
                        </a>

                        <a
                                th:href="@{/students/delete/{id}(id=${student.id})}"
                                class="btn btn-sm btn-danger">
                            Delete
                        </a>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="6" class="text-center text-muted py-4">
                        No students found.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
